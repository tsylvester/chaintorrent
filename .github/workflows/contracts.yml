name: Contracts

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts/evm

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: foundry-rs/foundry-toolchain@v1
    - run: forge build
    - run: forge fmt --check
    - run: forge test
