[package]
name = "envelope"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
encoding = { path = "../encoding" }
domain = { path = "../../crates/domain" }
zeroize = "1.9.0"
pairing = { path = "../pairing" }
hash-to-scalar = { path = "../hash-to-scalar" }
random = { path = "../random" }
kem = { path = "../kem" }
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
encoding = { path = "../encoding", features = ["mocks"] }
domain = { path = "../../crates/domain", features = ["mocks"] }
pairing = { path = "../pairing", features = ["mocks"] }
hash-to-scalar = { path = "../hash-to-scalar", features = ["mocks"] }
random = { path = "../random", features = ["mocks"] }
kem = { path = "../kem", features = ["mocks"] }
serde_json = "1.0.151"

[features]
mocks = ["domain/mocks", "kem/mocks", "dep:serde_json"]

[lints]
workspace = true
