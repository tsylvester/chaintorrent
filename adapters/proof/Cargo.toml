[package]
name = "proof"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
encoding = { path = "../encoding" }
chain = { path = "../chain" }
domain = { path = "../../crates/domain" }
hashing = { path = "../hashing" }
hash-to-scalar = { path = "../hash-to-scalar" }
pairing = { path = "../pairing" }
envelope = { path = "../envelope" }
kem = { path = "../kem" }
random = { path = "../random" }
serde_json = { version = "1.0.151", optional = true }
zeroize = "1.9.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
encoding = { path = "../encoding", features = ["mocks"] }
domain = { path = "../../crates/domain", features = ["mocks"] }
chain = { path = "../chain", features = ["mocks"] }
hashing = { path = "../hashing", features = ["mocks"] }
hash-to-scalar = { path = "../hash-to-scalar", features = ["mocks"] }
pairing = { path = "../pairing", features = ["mocks"] }
envelope = { path = "../envelope", features = ["mocks"] }
kem = { path = "../kem", features = ["mocks"] }
random = { path = "../random", features = ["mocks"] }
serde_json = "1.0.151"

[features]
mocks = ["domain/mocks", "encoding/mocks", "envelope/mocks", "chain/mocks", "hashing/mocks", "hash-to-scalar/mocks", "pairing/mocks", "kem/mocks", "random/mocks", "dep:serde_json"]

[lints]
workspace = true
