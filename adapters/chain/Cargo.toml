[package]
name = "chain"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
alloy = { version = "2.5.0", default-features = false, features = ["std", "sol-types", "json", "json-rpc", "provider-http", "reqwest-native-tls", "rpc-types-eth"] }
encoding = { path = "../encoding" }
domain = { path = "../../crates/domain" }
hashing = { path = "../hashing" }
pairing = { path = "../pairing" }
serde_json = "1.0.151"
sha3 = "0.12.0"
tokio = { version = "~1.53.0", default-features = false, features = ["rt"] }
url = "2.5.8"

[dev-dependencies]
encoding = { path = "../encoding", features = ["mocks"] }
domain = { path = "../../crates/domain", features = ["mocks"] }
hashing = { path = "../hashing", features = ["mocks"] }
pairing = { path = "../pairing", features = ["mocks"] }
tower = { version = "0.5.3", default-features = false }

[features]
mocks = ["encoding/mocks", "domain/mocks", "hashing/mocks", "pairing/mocks"]

[lints]
workspace = true
