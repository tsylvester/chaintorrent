[selections]
random_source = "OperatingSystem"
encoding = "Abi"
hash_to_scalar = "Keccak256"
chain_forms = "Evm"
kem = "Bb1DepthOne"
key_agreement = "PairingElGamal"
delivery_proof = "SchnorrFs"
verifier = "Evm"
identity_scope = "Entitlement"
envelope_algebra = "PairingElGamal"
delivery_statement_version = 1

[[selections.curves]]
label = "bn254"
pairing_concrete = "Bn254Arkworks"
target_group_encoding = "Bn254V1"

[[selections.curves]]
label = "bls12_381"
pairing_concrete = "Bls12381Arkworks"
target_group_encoding = "Bls12381V1"

[[selections.benchmark_concretes]]
pairing_concrete = "Bn254Arkworks"
target_group_encoding = "Bn254V1"

[[selections.benchmark_concretes]]
pairing_concrete = "Bn254Halo2curves"
target_group_encoding = "Bn254V1"

[[selections.benchmark_concretes]]
pairing_concrete = "Bls12381Arkworks"
target_group_encoding = "Bls12381V1"

[[selections.benchmark_concretes]]
pairing_concrete = "Bls12381Halo2curves"
target_group_encoding = "Bls12381V1"

[network_profile]
precompile_encodings = ["Eip196Eip197", "Eip2537"]
verifier_endpoint = "https://sepolia.base.org"
chain_identifier = { kind = "Unsigned256", value = "84532" }
entitlement_contract = { kind = "FixedBytes20", value = "0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee" }
deployment_record = { kind = "FixedBytes20", value = "0x0000000000000000000000000000000000000000" }
gas_price_oracle = { kind = "FixedBytes20", value = "0x420000000000000000000000000000000000000f" }

[statements.mint]
suite_identifier = "0x1111111111111111111111111111111111111111111111111111111111111111"
suite_version = 1
asset_root = "0x2222222222222222222222222222222222222222222222222222222222222222"
parameter_set_identifier = "0x3333333333333333333333333333333333333333333333333333333333333333"
source_entitlement = { kind = "Unsigned256", value = "1" }
target_entitlement = { kind = "Unsigned256", value = "1" }
old_interval = { kind = "Unsigned64", value = "0" }
new_interval = { kind = "Unsigned64", value = "0" }
seller = { kind = "FixedBytes20", value = "0x6161616161616161616161616161616161616161" }
buyer = { kind = "FixedBytes20", value = "0x6262626262626262626262626262626262626262" }
expiry = 1800000000
purpose = 1

[statements.transfer]
suite_identifier = "0x1111111111111111111111111111111111111111111111111111111111111111"
suite_version = 1
asset_root = "0x2222222222222222222222222222222222222222222222222222222222222222"
parameter_set_identifier = "0x3333333333333333333333333333333333333333333333333333333333333333"
source_entitlement = { kind = "Unsigned256", value = "1" }
target_entitlement = { kind = "Unsigned256", value = "1" }
old_interval = { kind = "Unsigned64", value = "0" }
new_interval = { kind = "Unsigned64", value = "1" }
seller = { kind = "FixedBytes20", value = "0x6262626262626262626262626262626262626262" }
buyer = { kind = "FixedBytes20", value = "0x6363636363636363636363636363636363636363" }
expiry = 1800000000
