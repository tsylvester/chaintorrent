[identities]
proof = "0x5555555555555555555555555555555555555555555555555555555555555555"
mapping = [
    "0x6666666666666666666666666666666666666666666666666666666666666666",
    "0x7777777777777777777777777777777777777777777777777777777777777777",
]

[generate]
concrete = "Solidity"
foundry_root = "contracts/evm"
generated_directory = ["generated"]
compiler_version = "0.8.38"
license = "UNLICENSED"
constants_library = { file = "Constants.sol", library = "Constants" }
records_library = { file = "VectorRecords.sol", library = "VectorRecords" }
curve_directories = { Bn254 = "bn254", Bls12381 = "bls12_381" }

[generate.kinds.G1Addition]
count = 16
file = "g1_addition.txt"
struct_name = "G1AdditionVector"
decode_function = "decodeG1Addition"
path_constant = "G1_ADDITION_PATH"

[generate.kinds.G1Multiplication]
count = 16
file = "g1_multiplication.txt"
struct_name = "G1MultiplicationVector"
decode_function = "decodeG1Multiplication"
path_constant = "G1_MULTIPLICATION_PATH"

[generate.kinds.PairingCheck]
count = 16
file = "pairing_check.txt"
struct_name = "PairingCheckVector"
decode_function = "decodePairingCheck"
path_constant = "PAIRING_CHECK_PATH"

[generate.kinds.G2Addition]
count = 16
file = "g2_addition.txt"
struct_name = "G2AdditionVector"
decode_function = "decodeG2Addition"
path_constant = "G2_ADDITION_PATH"

[generate.kinds.G1MultiScalarMultiplication]
count = 16
terms = 4
file = "g1_multi_scalar_multiplication.txt"
struct_name = "G1MultiScalarMultiplicationVector"
decode_function = "decodeG1MultiScalarMultiplication"
path_constant = "G1_MULTI_SCALAR_MULTIPLICATION_PATH"

[generate.kinds.G2MultiScalarMultiplication]
count = 16
terms = 4
file = "g2_multi_scalar_multiplication.txt"
struct_name = "G2MultiScalarMultiplicationVector"
decode_function = "decodeG2MultiScalarMultiplication"
path_constant = "G2_MULTI_SCALAR_MULTIPLICATION_PATH"

[generate.kinds.DecodeRejection]
file = "decode_rejection.txt"
struct_name = "DecodeRejectionVector"
decode_function = "decodeDecodeRejection"
path_constant = "DECODE_REJECTION_PATH"

[generate.kinds.HashToScalar]
count = 16
message_length = 32
file = "hash_to_scalar.txt"
struct_name = "HashToScalarVector"
decode_function = "decodeHashToScalar"
path_constant = "HASH_TO_SCALAR_PATH"

[generate.kinds.IdentityMapping]
file = "identity_mapping.txt"
struct_name = "IdentityMappingVector"
decode_function = "decodeIdentityMapping"
path_constant = "IDENTITY_MAPPING_PATH"

[generate.kinds.Possession]
count = 16
file = "possession.txt"
struct_name = "PossessionVector"
decode_function = "decodePossession"
path_constant = "POSSESSION_PATH"

[generate.kinds.Challenge]
count = 16
file = "challenge.txt"
struct_name = "ChallengeVector"
decode_function = "decodeChallenge"
path_constant = "CHALLENGE_PATH"

[generate.kinds.MintProof]
count = 16
file = "mint_proof.txt"
struct_name = "MintProofVector"
decode_function = "decodeMintProof"
path_constant = "MINT_PROOF_PATH"

[generate.kinds.TransferProof]
count = 16
file = "transfer_proof.txt"
struct_name = "TransferProofVector"
decode_function = "decodeTransferProof"
path_constant = "TRANSFER_PROOF_PATH"

[benchmark]
iterations = 100

[measurement]
iterations = 100
conditions = "Base Sepolia verifier, L1 data fee as Sepolia's, one idle machine"

[report]
destinations = [{ kind = "File", path = "harness-report.json" }]
piece_group_size = 16384
primary_curve = "bls12_381"

[output]
destinations = [{ kind = "StandardOutput" }]
